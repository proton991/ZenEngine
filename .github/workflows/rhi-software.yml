name: RHI software-driver checks

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read

jobs:
  windows-software:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VULKAN_SDK: C:\VulkanSDK\1.4.357.0
      VK_LOADER_LAYERS_DISABLE: '~implicit~'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '--root C:\VulkanSDK\1.4.357.0 --accept-licenses --default-answer --confirm-command install' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "SDK install failed: $($process.ExitCode)" }
          "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH
      - name: Configure compiler
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./ZenRHI/.github/actions/software-driver
      - name: Build and test standalone libraries
        shell: pwsh
        run: |
          cmake -S ZenFoundation -B build/foundation-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$pwd/build/library-prefix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/foundation-ci -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/foundation-ci --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/foundation-ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S ZenRHI -B build/rhi-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$pwd/build/library-prefix" -DZENRHI_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/rhi-ci --target ZenRHICoreTests ZenRHIVulkanTests ZenRHIVulkanIntegrationTests -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_rhi_production.py --rhi-build-dir build/rhi-ci --output build/software-results/rhi --software-driver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Relocate the SDK and build the standalone examples
        shell: pwsh
        run: |
          $suites = Get-Content -Raw build/software-results/rhi/results.json | ConvertFrom-Json
          $native = $suites | Where-Object name -eq ZenRHIVulkanIntegrationTests
          $run = if ($native.skipped_suite) { 'OFF' } else { 'ON' }
          cmake -S ZenRHI -B build/rhi-ci "-DZENRHI_RUN_INSTALLED_TESTS=$run"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/rhi-ci --output-on-failure -L package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Scheduled AddressSanitizer acceptance and SPIR-V reflection fuzzing
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          # The SDK ships a prebuilt static SPIRV-Tools with MSVC container annotations disabled.
          cmake -S ZenRHI -B build/rhi-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DZEN_FOUNDATION_SOURCE_DIR="$pwd/ZenFoundation" -DZENRHI_BUILD_EXAMPLES=OFF -DCMAKE_CXX_FLAGS="/EHsc /fsanitize=address /D_DISABLE_VECTOR_ANNOTATION /D_DISABLE_STRING_ANNOTATION" -DCMAKE_C_FLAGS="/fsanitize=address"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/rhi-asan -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_rhi_production.py --rhi-build-dir build/rhi-asan --output build/software-results/asan --software-driver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S ZenRHI -B build/rhi-asan -DZENRHI_BUILD_REFLECTION_FUZZER=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/rhi-asan --target ZenRHIReflectionFuzzer -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/rhi-asan/tests/ZenRHIReflectionFuzzer.exe -max_total_time=120 -max_len=65536 build/rhi-asan/tests/shaders
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test hardware-independent suites
        shell: pwsh
        run: |
          cmake --preset x64-windows-msvc-release -DZEN_BUILD_RUNTIME_UI=OFF -DZEN_BUILD_ASSET_TOOLS=ON -DZEN_BUILD_ASSET_INTEGRATION_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Engine configure failed' }
          cmake --build --preset x64-windows-msvc-release --target CommonTest RenderCoreTest VulkanRHITest ZenAssetEngineTests -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Engine build failed' }
          python tools/verify_rhi_production.py --build-dir build/x64-windows-msvc-release --output build/software-results/engine --unit-only
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }
          ctest --test-dir build/x64-windows-msvc-release --output-on-failure -R "^ZenAssetEngineTests$"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhi-software-results
          path: |
            build/software-results
            build/software-driver.txt
