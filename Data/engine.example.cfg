# Copy to engine.cfg and adjust model_base_path for your asset checkout.
# Relative model paths are resolved from this config's directory, independent of launch directory.
# Optional default_model_path overrides default_model; absolute paths are also supported.
# Optional camera_position=x,y,z overrides the initial eye when the glTF has no camera.
model_base_path=E:\Dev\glTF-Sample-Assets\Models
default_model=Sponza
# Use automatic framing above an AABB corner. Uncomment to set a custom initial eye.
# camera_position=0.55,-0.15,0
async_compute=off
# Swapchain present mode: default, fifo, fifo_relaxed, mailbox or immediate.
# default follows --vsync: FIFO when on; IMMEDIATE, then MAILBOX, then FIFO when off.
# Other values override --vsync and fall back to FIFO when the surface lacks them.
present_mode=default
# GI: these keys, ZenApp --gi-<name> (name without voxel_gi_) and Rendering > GI settings share one
# option list; ZenApp --help prints it, and the panel copies or saves the current values here.
# optimal chooses the configuration for this GPU at startup: screen probes with the world cache,
# gathered at native resolution, with the spatiotemporal denoiser. They trace with the hardware RT
# pipeline and use ray-traced shadows with reuse; without an RT pipeline they trace the Compute
# distance field and use shadow maps. A forced --backend=hardware on a ray-query-only GPU uses
# per-pixel ReSTIR at automatic resolution instead. Measurements: Doc/HybridGI/GIConfiguration.md.
# A configuration key below switches to custom; content keys keep optimal.
voxel_gi_enabled=true
voxel_gi_preset=optimal
# Configuration:
# voxel_gi_method=per-pixel|per-pixel-restir|per-pixel-cache|per-pixel-restir-cache|screen-probes
# voxel_gi_tracing=auto|compute|ray-queries|rt-pipeline
# voxel_gi_pixel_resolution_divisor=auto|1|2|4
# voxel_gi_restir_spatial_samples=1..4
# voxel_gi_denoiser=spatiotemporal|temporal|spatial|off
# voxel_gi_shadows=maps|ray-traced|ray-traced-reuse
# shadow_map_resolution=1024
# Content:
# voxel_gi_indirect_intensity=1.0
# voxel_gi_reflections=true
# voxel_gi_shadow_enabled=true
# Environment files: 2:1 HDR panoramas or RGBA16F/32F KTX/DDS cubemaps.
# Relative paths resolve under Data/Textures; absolute paths are accepted too.
environment_texture=papermill.ktx
environment_lighting=true
environment_intensity=1.0
environment_rotation_degrees=0.0
skybox_visible=true

# Positions/ranges are in the centered, normalized renderer world coordinates.
# Supported types: point, directional, spot. Colors are linear RGB.
# Spot lights also use direction, inner_angle_degrees, outer_angle_degrees.
# glTF lights are used when present; otherwise six lights surround the scene AABB.
# Set scene_lighting_override=true to use the diagnostic lights below on an unlit asset.
# light_count=0 disables analytic lights only with that override enabled.
scene_lighting_override=false
light_count=5
# Visible point/spot-light boxes; side length is in normalized world units.
light_markers.enabled=true
light_markers.size=0.03
# Four static lights inside Sponza's lower hall, below the first-floor ceiling.
light.0.type=point
light.0.position=-0.55,-0.25,-0.13
light.0.color=1,1,1
light.0.intensity=5
light.0.range=1000
light.1.type=point
light.1.position=0.55,-0.25,-0.13
light.1.color=1,1,1
light.1.intensity=5
light.1.range=1000
light.2.type=point
light.2.position=-0.55,-0.25,0.13
light.2.color=1,1,1
light.2.intensity=5
light.2.range=1000
light.3.type=point
light.3.position=0.55,-0.25,0.13
light.3.color=1,1,1
light.3.intensity=5
light.3.range=1000
light.4.type=point
light.4.position=1,1,0
light.4.color=0.2,0.4,1.0
light.4.intensity=2
light.4.range=4
light.4.enabled=true
light.4.casts_shadows=true

# Demo animation uses the same runtime light API intended for later UI controls.
dynamic_light.enabled=true
dynamic_light.index=4
dynamic_light.orbit_center=0,1,0
dynamic_light.orbit_radius=1
dynamic_light.angular_speed_degrees=45
