# Copy to engine.cfg and adjust model_base_path for your asset checkout.
# Relative model paths are resolved from this config's directory, independent of launch directory.
# Optional default_model_path overrides default_model; absolute paths are also supported.
# Optional camera_position=x,y,z overrides the initial eye (looks at scene center).
model_base_path=E:\Dev\glTF-Sample-Assets\Models
default_model=Sponza
# Start inside Sponza's hall; light markers are visible in PBR (2) and voxel GI (3).
camera_position=0.55,-0.15,0
voxelizer=auto
async_compute=auto
# Shared grid resolution for voxel visualization and GI: 64, 128, or 256.
# If omitted: dynamic_voxel uses 64; auto/cone use 256. Explicit values are preserved.
voxel_resolution=256
# Owner remains the compatibility default. To opt into the verified mean, use
# averaged and an explicit incremental scratch/output budget (MiB).
# V1 uses 20*N^3 bytes per output set: 5/40/320 MiB at 64/128/256, plus retired V1 resources.
# A device storage-range or contribution-count rejection is logged and uses owner.
voxel_reflectance_policy=owner
# voxel_reflectance_policy=averaged
# voxel_reflectance_budget_mb=512
# GI method and visibility backend are independent of the voxelizer above.
# M7: opt-in dynamic_voxel is verified at 64/128 cubed with static/dynamic geometry,
# up to 32 analytic lights, diffuse environment/emissive transport and filtering.
# Requires at least seven attachments. 256 is budget-gated; only rejection/fallback
# is verified for directional GI at that resolution. Resolution is fixed at startup;
# bounds change only through RenderScene::SetVoxelBounds. Outside coverage uses PBR.
# Unsupported profiles and auto select cone when it fits the configured GI budget;
# otherwise mode 3 uses PBR. Hardware RT remains deferred.
# Accepted methods: auto, cone, dynamic_voxel. Providers: auto, voxel_dda, hardware_rt.
voxel_gi_method=auto
dynamic_voxel_gi_query_backend=auto
# Samples: 32, 64 or 128 rays per face; 128 is the deterministic reference preset.
# Sample count and cache format are startup settings. Lower sample counts require
# the documented quality tradeoff. Dynamic neighborhood radius: 2 (5^3) or 1 (3^3).
dynamic_voxel_gi_rays_per_face=128
# compact stores exact cell/class and full float distance in 8 bytes; decoded
# retains the 96-byte reference record. Both resolve live DDA surface attributes.
dynamic_voxel_gi_cache=compact
dynamic_voxel_gi_neighbor_radius=2
# Elapsed-time filtering is the default; fixed uses alpha=0.03 each update.
dynamic_voxel_gi_temporal_filter=elapsed
dynamic_voxel_gi_spatial_filter=true
# These affect directional diffuse transport; direct lighting/specular IBL remain independent.
dynamic_voxel_gi_analytic_lighting=true
dynamic_voxel_gi_environment_lighting=true
dynamic_voxel_gi_emissive_lighting=true
# No default total memory cap is guessed. Set an explicit positive MiB budget
# before enabling dynamic_voxel or class outputs; separate from the V1 cap.
# Decoded static caches cost 72 KiB per reserved receiver plus frame grids/fallback.
# 3072 MiB passed the 64/128-cubed M7 fixtures at a 256-square G-buffer;
# 6144 MiB passed 64-cubed Sponza. These are fixture caps, not shipping defaults.
# Cache initialization/overflow/unknown visibility uses the budgeted cone reserve.
# Even cone fallback must fit this cap; an exhausted cap selects PBR. See
# Doc/DynamicVoxelGIM7Verification.md for controls, evidence and approximation limits.
# dynamic_voxel_gi_memory_budget_mb=3072
# Environment files are RGBA16F cubemaps under Data/Textures.
environment_texture=papermill.ktx
environment_lighting=true
environment_intensity=1.0
environment_rotation_degrees=0.0
skybox_visible=true

voxel_gi_indirect_intensity=1.0
voxel_gi_cone_count=6
voxel_gi_cone_angle_degrees=60.0
voxel_gi_step_scale=1.0
voxel_gi_normal_bias_voxels=1.5
voxel_gi_max_distance_grid_lengths=1.7321
voxel_gi_max_steps=128
voxel_gi_shadow_enabled=true
# Direct mesh shadows in GI mode: per-face resolution, 128..2048 (default 1024).
# Point lights use six faces; independent of voxel_resolution and voxel workgroups.
shadow_map_resolution=1024

# Positions/ranges are in the centered, normalized renderer world coordinates.
# Supported types: point, directional, spot. Colors are linear RGB.
# Spot lights also use direction, inner_angle_degrees, outer_angle_degrees.
# light_count=0 disables analytic lights. Omitting it preserves the old four lights.
light_count=5
# Visible point/spot-light boxes; side length is in normalized world units.
light_markers.enabled=true
light_markers.size=0.03
# Four static lights inside Sponza's lower hall, below the first-floor ceiling.
light.0.type=point
light.0.position=-0.55,-0.25,-0.13
light.0.color=1,1,1
light.0.intensity=5
light.0.range=1000
light.1.type=point
light.1.position=0.55,-0.25,-0.13
light.1.color=1,1,1
light.1.intensity=5
light.1.range=1000
light.2.type=point
light.2.position=-0.55,-0.25,0.13
light.2.color=1,1,1
light.2.intensity=5
light.2.range=1000
light.3.type=point
light.3.position=0.55,-0.25,0.13
light.3.color=1,1,1
light.3.intensity=5
light.3.range=1000
light.4.type=point
light.4.position=1,1,0
light.4.color=0.2,0.4,1.0
light.4.intensity=2
light.4.range=4
light.4.enabled=true
light.4.casts_shadows=true

# Demo animation uses the same runtime light API intended for later UI controls.
dynamic_light.enabled=true
dynamic_light.index=4
dynamic_light.orbit_center=0,1,0
dynamic_light.orbit_radius=1
dynamic_light.angular_speed_degrees=45
